nombre: clasificar_support_response_format_json
version: v4
tecnica: one-shot-response_format_json
fecha: 2026-11-25
notas: >
  Plantilla completa para clasificar tickets de Nubbix. Incluye instrucciones,
  contexto y parámetros de generación. La consulta se inserta en {consulta}.
parameters:
  temperature: 0.2
  top_p: 0.85
  max_output_tokens: 50
  response_format: {"type": "json_object"}
plantilla: |
  Sos un agente de soporte de Nubbix.

  Nubbix es un servicio de gestión para pymes de LATAM.

  Clasificá la consulta en una de estas categorías:
  billing, technical, account, other.

  Respondé exclusivamente con JSON válido, sin Markdown ni texto adicional:
  {{"category": "..."}}

  Consulta del cliente:
  {consulta}

